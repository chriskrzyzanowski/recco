<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recco — AI menu intelligence</title>
<link rel="stylesheet" href="recco/tokens.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter Tight', -apple-system, system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #f0eee9;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    overflow: hidden;
  }
  /* Scale the iPhone frame down on smaller viewports so the whole device
     stays visible — without this the bottom of the frame (and any sticky
     CTAs) gets cut off on laptop-sized windows or mobile browser chrome. */
  .device-fit {
    width: 390px; height: 844px;
    transform-origin: center center;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Feature flags — flip RECCO_ENABLE_LIVE_AI to true once a real chat backend is wired -->
<script>window.RECCO_ENABLE_LIVE_AI = false;</script>

<!-- Data -->
<script src="recco/data.js?v=4"></script>

<!-- Frames + canvas -->
<script type="text/babel" src="recco/ios-frame.jsx"></script>

<!-- Components -->
<script type="text/babel" src="recco/components.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="recco/screens/Home.jsx"></script>
<script type="text/babel" src="recco/screens/Results.jsx"></script>
<script type="text/babel" src="recco/screens/DishDetail.jsx"></script>
<script type="text/babel" src="recco/screens/Onboarding.jsx"></script>
<script type="text/babel" src="recco/screens/FlavorSwipe.jsx"></script>
<script type="text/babel" src="recco/screens/Scan.jsx"></script>
<script type="text/babel" src="recco/screens/Account.jsx"></script>
<script type="text/babel" src="recco/screens/Chat.jsx"></script>
<script type="text/babel" src="recco/screens/Landing.jsx"></script>
<script type="text/babel" src="recco/screens/Paywall.jsx"></script>

<!-- App router -->
<script type="text/babel" src="recco/app.jsx"></script>

<!-- Mount -->
<script type="text/babel">
  function useFitScale(margin = 24) {
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      function fit() {
        const maxH = window.innerHeight - margin * 2;
        const maxW = window.innerWidth - margin * 2;
        setScale(Math.min(1, maxH / 844, maxW / 390));
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      return () => {
        window.removeEventListener('resize', fit);
        window.removeEventListener('orientationchange', fit);
      };
    }, [margin]);
    return scale;
  }

  function Root() {
    const scale = useFitScale();
    return (
      <div className="stage" data-screen-label="Recco — Prototype">
        <div className="device-fit" style={{ transform: `scale(${scale})` }}>
          <IOSDevice width={390} height={844}>
            <ReccoApp initialRoute="landing" />
          </IOSDevice>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
